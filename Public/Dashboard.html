<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard • Coliseum Gym</title>
  <link rel="stylesheet" href="/assets/CSS/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/Principal.html">
        <img class="logo" src="/assets/Img/logo-coliseum.png" alt="Coliseum Gym" loading="lazy" />
        <span class="brand-home">Inicio</span>
      </a>
      <nav class="main-nav" aria-label="Principal"></nav>
      <div id="header-cta" class="header-cta"></div>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="dashboard-layout">
      <nav id="dash-sidebar" class="dashboard-sidebar">
        <button class="btn btn-ghost" onclick="location.href='../Principal.html'">Inicio</button>
        <button class="btn btn-ghost" onclick="location.href='productos.html'">Productos</button>
        <button class="btn btn-ghost" onclick="location.href='Servicios.html'">Servicios</button>
        <button class="btn btn-ghost" onclick="location.href='clientes.html'">Clientes</button>
        <button class="btn btn-ghost" onclick="location.href='reservas.html'">Reservas</button>

        <!-- <button class="btn btn-ghost" data-future="Carrito" onclick="location.href='Reportes.html'">Reportes y metricas</button> -->
        <button class="btn btn-ghost" data-future="Reportes" >Reportes y metricas</button>
        <!-- <button class="btn btn-ghost" onclick="location.href='Contenido.html'">Contenido</button> -->
        <button class="btn btn-ghost" data-future="Contenido">Contenido</button>
        
      </nav>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bar">© <span id="y">2025</span> Coliseum Gym.</div>
  </footer>

  <script src="/assets/JS/auth.js"></script>
  <script src="/assets/JS/Dashboard.js"></script>
</body>
</html>
