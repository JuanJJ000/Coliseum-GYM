<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reportes • Coliseum Gym</title>
  <link rel="stylesheet" href="/assets/CSS/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/Principal.html">
        <img class="logo" src="/assets/Img/logo-coliseum.png" alt="Coliseum Gym" loading="lazy" />
        <span class="brand-home">Inicio</span>
      </a>
      <div id="header-cta" class="header-cta"></div>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="container">
      <h1>Reportes</h1>

      <section style="margin-top:2rem;">
        <h2>Productos</h2>
        <table id="productos-report" border="1" cellspacing="0" cellpadding="6" style="margin-top:0.5rem;">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Categoría</th>
              <th>Descuento</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="7">Cargando...</td></tr>
          </tbody>
        </table>
      </section>

      <section style="margin-top:2rem;">
        <h2>Categorías</h2>
        <table id="categorias-report" border="1" cellspacing="0" cellpadding="6" style="margin-top:0.5rem;">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="3">Cargando...</td></tr>
          </tbody>
        </table>
      </section>

      <section style="margin-top:2rem;">
        <h2>Clientes</h2>
        <table id="clientes-report" border="1" cellspacing="0" cellpadding="6" style="margin-top:0.5rem;">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Email</th>
              <th>Usuario</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="3">Cargando...</td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bar">© <span id="y">2025</span> Coliseum Gym.</div>
  </footer>

  <script src="/assets/JS/auth.js"></script>
  <script src="/assets/JS/reportes.js"></script>
</body>
</html>
