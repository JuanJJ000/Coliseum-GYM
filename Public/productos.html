<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Productos • Coliseum Gym</title>
  <link rel="stylesheet" href="/assets/CSS/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/Principal.html">
        <img class="logo" src="/assets/Img/logo-coliseum.png" alt="Coliseum Gym" loading="lazy" />
        <span class="brand-home">Inicio</span>
      </a>
      <div id="header-cta" class="header-cta"></div>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="container">
      <h1>Productos</h1>

      <button id="btn-add-producto" class="btn btn-primary">Agregar Producto</button>

      <!-- Formulario oculto -->
      <form id="form-producto" style="display:none; margin-top:1rem; border:1px solid #ccc; padding:1rem; border-radius:6px;">
        <div>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" required />
        </div>
        <div>
          <label for="descripcion">Descripción:</label>
          <textarea id="descripcion" required></textarea>
        </div>
        <div>
          <label for="precio">Precio:</label>
          <input type="number" id="precio" min="0" step="0.01" required />
        </div>
        <div>
          <label for="stock">Stock:</label>
          <input type="number" id="stock" min="0" required />
        </div>
        <div>
          <label for="categoria">Categoría:</label>
          <select id="categoria" required></select>
        </div>
        <div>
          <label for="descuento">Descuento:</label>
          <select id="descuento"></select>
        </div>
        <div>
          <label for="estado">Activo:</label>
          <input type="checkbox" id="estado" checked />
        </div>
        <div>
          <label for="imagen">URL Imagen (opcional):</label>
          <input type="text" id="imagen" />
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <button type="button" id="cancel-form" class="btn btn-secondary">Cancelar</button>
      </form>

      <table id="productos-table" border="1" cellspacing="0" cellpadding="6" style="margin-top:1rem;">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Categoría</th>
            <th>Descuento</th>
            <th>Estado</th>
            <th>Imagen</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="9">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bar">© <span id="y">2025</span> Coliseum Gym.</div>
  </footer>

  <script src="/assets/JS/auth.js"></script>
  <script src="/assets/JS/productos.js"></script>
</body>
</html>
