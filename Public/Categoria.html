<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Categorías • Coliseum Gym</title>
  <link rel="stylesheet" href="/assets/CSS/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/Principal.html">
        <img class="logo" src="/assets/Img/logo-coliseum.png" alt="Coliseum Gym" loading="lazy" />
        <span class="brand-home">Inicio</span>
      </a>
      <div id="header-cta" class="header-cta"></div>
    </div>
  </header>
  <div class="cat-actions" style="margin: 1rem 0;">
    <button id="btn-add-categoria" class="btn btn-primary">➕ Agregar Categoría</button>
  </div>

  <!-- FORMULARIO OCULTO -->
  <div id="cat-form" class="card" style="display:none; padding:1rem; margin-bottom:1rem;">
    <h2>Crear nueva categoría</h2>
    
    <label>Nombre:</label>
    <input id="cat-nombre" type="text" class="input" placeholder="Nombre de la categoría">

    <label>Descripción:</label>
    <textarea id="cat-desc" class="input" placeholder="Descripción..."></textarea>

    <label>Estado:</label>
    <select id="cat-estado" class="input">
      <option value="true">Activo</option>
      <option value="false">Inactivo</option>
    </select>

    <div style="margin-top:1rem;">
      <button id="cat-save" class="btn btn-primary">Guardar</button>
      <button id="cat-cancel" class="btn btn-secondary">Cancelar</button>
    </div>
  </div>


  <main class="dashboard-main">
    <div class="container">
      <h1>Categorías</h1>
      <table id="categoria-table" border="1" cellspacing="0" cellpadding="6">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="4">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bar">© <span id="y">2025</span> Coliseum Gym.</div>
  </footer>

  <script src="/assets/JS/auth.js"></script>
  <script src="/assets/JS/categoria.js"></script>
</body>
</html>
