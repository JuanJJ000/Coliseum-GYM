<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Cliente • Coliseum Gym</title>
  <link rel="stylesheet" href="/assets/CSS/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/Principal.html">
        <img class="logo" src="/assets/Img/logo-coliseum.png" alt="Coliseum Gym" loading="lazy" />
        <span class="brand-home">Inicio</span>
      </a>
      <nav class="main-nav" aria-label="Principal"></nav>
      <div id="header-cta" class="header-cta"></div>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="dashboard-layout">
      <nav id="dash-sidebar" class="dashboard-sidebar">
        <button class="btn btn-ghost" onclick="location.href='../Principal.html'">Inicio</button>
        <button class="btn btn-ghost" onclick="location.href='productos.html'">Ver Productos</button>
        <button class="btn btn-ghost" onclick="location.href='Servicios.html'">Ver Servicios</button>
        <button class="btn btn-ghost" onclick="location.href='reservas.html'">Mis Reservas</button>
        <button class="btn btn-ghost" onclick="location.href='Reportes.html'">Mis Reportes</button>
      </nav>

      <section class="dashboard-content">
        <h1>Bienvenido, cliente</h1>
        <p>Desde aquí puedes explorar nuestros productos y servicios, gestionar tus reservas y consultar tus reportes.</p>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bar">© <span id="y">2025</span> Coliseum Gym.</div>
  </footer>

  <script src="/assets/JS/auth.js"></script>
  <script src="/assets/JS/Dashboard-cliente.js"></script>
</body>
</html>
